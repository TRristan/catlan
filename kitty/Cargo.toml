[package]
name = "kitty"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.36.1"
tao = "0.37.3"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tray-icon = "0.24.2"
ureq = { version = "2", features = ["native-certs"] }
wry = "0.57.3"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
# control remoto: capturar la pantalla, comprimirla y mover el ratón y el teclado
jpeg-encoder = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

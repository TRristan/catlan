name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/test_catlan.py
      # La web en un navegador de verdad: login, alta de equipo, incidencia y «Añadir con Kitty»
      - run: pip install playwright==1.65.2 && python -m playwright install --with-deps chromium
      - run: python tests/test_ui.py
  kitty:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p kitty --locked
      - run: cargo build --release -p kitty --locked
